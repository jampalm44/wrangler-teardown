<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrangler 2.5L Teardown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: workbench app. Header with system chips, 3D stage on the left with tool rows under it, service-manual panel on the right. Stacks on phones. */
:root{
  --bg:#e8ecf0; --panel:#f8f9fb; --fg:#18212b; --muted:#566273; --line:#cdd5de;
  --chip:#ffffff; --viewport:#dce3ea; --accent:#b87300; --accent-soft:rgba(184,115,0,.12);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --panel:#141b22; --fg:#e3e8ee; --muted:#8f9cac; --line:#26313c;
  --chip:#1a232d; --viewport:#0a0f14; --accent:#f0b030; --accent-soft:rgba(240,176,48,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:#141b22; --fg:#e3e8ee; --muted:#8f9cac; --line:#26313c;
  --chip:#1a232d; --viewport:#0a0f14; --accent:#f0b030; --accent-soft:rgba(240,176,48,.14); color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.top{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;min-width:0}
.brand{min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;font:500 12.5px var(--f-body);color:var(--fg);
  background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 14%,var(--chip))}
.chipsep{flex:none;width:1px;background:var(--line);margin:3px 2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:12px;min-height:0}
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;min-height:0;min-width:0}
.viewport{position:relative;border-radius:10px;overflow:hidden;background:var(--viewport);border:1px solid var(--line);min-height:0;touch-action:none}
.viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.toolrows{display:grid;gap:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:500 13px var(--f-body);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1200;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,input:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slider{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:4px 12px;font:500 13px var(--f-body)}
.slider input{width:120px;accent-color:var(--accent)}
.slider.off{opacity:.45}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--chip)}
.seg button{font:500 13px var(--f-body);color:var(--fg);background:none;border:0;border-right:1px solid var(--line);padding:7px 11px;cursor:pointer;min-width:34px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg.mono button{font-family:var(--f-mono);font-size:12.5px}
.seglbl{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:4px}

.hint{position:absolute;left:12px;bottom:10px;font:12px var(--f-mono);color:var(--muted);pointer-events:none;max-width:calc(100% - 24px)}
.overlay{position:absolute;left:12px;top:12px;display:grid;gap:8px;pointer-events:none;max-width:calc(100% - 24px)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,auto));gap:4px;justify-content:start}
.strip .cell{background:color-mix(in srgb,var(--c) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:6px;padding:4px 8px;min-width:70px}
.strip .n{font:600 11px var(--f-mono);color:var(--muted)}
.strip .s{font:700 15px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.strip .meta{grid-column:1/-1;font:11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.drivebox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;line-height:1.45;min-width:0}
.drivebox b{font:700 15px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin-right:8px}
.drivebox .note{display:block}
.drivebox .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.drivebox .note{color:var(--muted);margin-top:3px}
.cbar{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:6px 6px 6px 12px;box-shadow:0 4px 18px rgba(0,0,0,.12);max-width:calc(100% - 24px);flex-wrap:wrap}
.cbar .count{font:700 18px var(--f-display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.cbar .lbl{font-size:12px;color:var(--muted)}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font:500 13px var(--f-body);padding:8px 14px;border-radius:8px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:500 12px var(--f-body);white-space:nowrap;transform:translate(12px,12px)}
.tip i{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-left:6px}

.panel{overflow-y:auto;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px 24px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:12px var(--f-mono);color:var(--muted);margin-bottom:10px}
.link{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--fg)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow .sw{width:10px;height:10px;border-radius:2px;background:var(--c)}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:6px 0 10px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.panel h3{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.panel h4{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.panel p{margin:0 0 10px;max-width:62ch}
.lede{font-size:15px}
dl.specs{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 14px;margin:0}
dl.specs dt{font:12px var(--f-mono);color:var(--muted);padding-top:1px}
dl.specs dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.watch{background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.watch p{margin:0}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel .chip{font-size:12px;padding:4px 10px}
.syslist{display:grid;gap:6px}
.sysrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;width:100%;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--fg);font:inherit}
.sysrow:hover{border-color:var(--c)}
.sysrow .sw{width:12px;height:12px;border-radius:3px;background:var(--c);margin-top:3px}
.sysrow b{font-weight:600;display:block}
.sysrow small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block}
.sysrow .ct{font:12px var(--f-mono);color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.foot{margin-top:22px;font-size:12px;color:var(--muted)}
.howto{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.howto li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.howto b{font:500 12px var(--f-mono);color:var(--muted);padding-top:1px}
.challengecard{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-bottom:14px}

@media (max-width:880px){
  body{overflow:auto}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .stage{grid-template-rows:auto auto}
  .viewport{height:62svh;min-height:360px}
  .panel{overflow:visible}
  .slider input{width:96px}
  h1{font-size:24px}
  .hint{display:none}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Wrangler 2.5L Teardown</h1>
      <p class="sub">2000 Jeep Wrangler TJ · 2.5L I4 · AX5 five-speed · NP231</p>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Highlight a system"></div>
  </header>
  <main class="main">
    <section class="stage">
      <div class="viewport" id="vp">
        <div class="overlay">
          <div class="strip" id="strip" hidden></div>
        </div>
        <div class="cbar" id="cbar" hidden></div>
        <div class="toast" id="toast" hidden></div>
        <div class="tip" id="tip" hidden></div>
        <div class="hint" id="hint">Drag a part to pull it off · Click for details · Drag empty space to orbit · Right-drag to pan · Scroll to zoom</div>
      </div>
      <div class="toolrows">
        <div class="tools">
          <div class="seg" id="viewSeg" role="group" aria-label="View">
            <button data-v="jeep" aria-pressed="true">Whole Jeep</button><button data-v="engine" aria-pressed="false">Engine only</button>
          </div>
          <label class="slider" id="explodeWrap" for="explode"><span>Explode</span><input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
          <button class="btn" id="xray" aria-pressed="true">See inside</button>
          <button class="btn" id="reassemble">Reassemble</button>
          <button class="btn" id="resetView">Reset view</button>
          <span class="spacer"></span>
          <button class="btn primary" id="challenge">Rebuild challenge</button>
        </div>
        <div class="tools">
          <button class="btn" id="run" aria-pressed="true">Stop engine</button>
          <button class="btn" id="speed" aria-pressed="false">Speed: slow</button>
          <span id="driveCtl" style="display:contents">
            <span class="seglbl">Gear</span>
            <div class="seg mono" id="gearSeg" role="group" aria-label="Transmission gear"></div>
            <span class="seglbl">Transfer case</span>
            <div class="seg mono" id="tcSeg" role="group" aria-label="Transfer case range"></div>
          </span>
        </div>
        <div class="drivebox" id="drivebox" hidden></div>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const V = THREE.Vector3;

/* ---------- Systems ---------- */
const SYS = {
  core:{name:"Engine core",color:"#8d97a3",desc:"The block, head, covers, and accessory belt form the sealed structure that everything else on the engine bolts to."},
  rotating:{name:"Rotating assembly",color:"#c9783f",desc:"Pistons, connecting rods, the crankshaft, and the flywheel turn the push of burning fuel into a spinning shaft."},
  valvetrain:{name:"Valvetrain",color:"#c3a53c",desc:"The camshaft, timing chain, and valves open and close each cylinder's ports in step with the pistons."},
  airfuel:{name:"Air & fuel",color:"#3e8ed0",desc:"Fuel is pumped from the tank to the injectors, and air comes in through the throttle body and intake manifold."},
  ignition:{name:"Ignition",color:"#d6485b",desc:"Sensors tell the computer where the pistons are, and the coil, distributor, and plugs fire each cylinder at the right moment."},
  cooling:{name:"Cooling",color:"#25ab9d",desc:"Coolant carries heat from the block and head to the radiator, where moving air takes it away."},
  ac:{name:"Air conditioning",color:"#b9dbe8",desc:"The compressor pumps refrigerant through the condenser up front and the evaporator behind the dash, carrying heat out of the cab and dumping it into the outside air."},
  lube:{name:"Lubrication",color:"#8e6fd6",desc:"The oil pump pulls oil from the pan and sends it through the filter to every bearing and moving surface."},
  exhaust:{name:"Exhaust",color:"#8a5f45",desc:"Burned gas leaves through the manifold, catalytic converter, and muffler, while oxygen sensors report how well the fuel burned."},
  electrical:{name:"Electrical",color:"#5aa548",desc:"The battery, alternator, and starter supply power; fuses, relays, and the engine computer distribute and control it."},
  drivetrain:{name:"Drivetrain",color:"#d46fa0",desc:"The clutch, AX5 transmission, NP231 transfer case, driveshafts, and axles carry engine power to the wheels."},
  wheels:{name:"Wheels & tires",color:"#b0a27e",desc:"Four road wheels and a tailgate spare. Tire size sets how far the Jeep travels for each turn of the axles."},
  suspension:{name:"Suspension",color:"#4cc0e0",desc:"Quadra-Coil: a coil spring at each corner, with control arms and a track bar holding each solid axle in place."},
  steering:{name:"Steering",color:"#a8c23a",desc:"The steering wheel turns a power-assisted gear box on the frame, which pushes linkage that swings the front knuckles."},
  brakes:{name:"Brakes",color:"#e8613c",desc:"The pedal pushes fluid from the master cylinder to discs up front and drums at the rear."},
  frame:{name:"Frame & body",color:"#6e7a88",desc:"A steel ladder frame carries everything, and the body tub, fenders, and hood bolt on top."}
};
const SYS_ORDER = Object.keys(SYS);
const ENGINE_SYS = ["core","rotating","valvetrain","airfuel","ignition","cooling","ac","lube","exhaust","electrical"];

/* ---------- Geometry constants (inches). +x = front, +z = driver side, y = up ---------- */
const CYL_X = [6.6, 2.2, -2.2, -6.6];
const PHASE = [0, 540, 180, 360];
const THROW = [0, Math.PI, Math.PI, 0];
const CR = 1.594, ROD = 5.875, LIFT = 0.42;
const CAM_Y = 4.2, CAM_Z = -2.2;
const DIST = {x:-0.5, z:-5.6, top:9.75};
const TERM_ANGLE = [0, 270, 90, 180];
const EXH_PIPE = [[-1,8.2,6.4],[-1.8,5,7.0],[-3,1,7.2],[-5,-3,7.0],[-8,-6,6.4]];
const ENG = new V(36,25,0);               // engine origin (crank centerline, rear of cyl 1 area) in vehicle space
const FA = 46.7, RA = -46.7, AY = 13.5, TZ = 29, RZ = 14.5;   // axles, axle height, half track, frame rail z
const GEARS = {R:-4.74, N:0, "1":3.93, "2":2.33, "3":1.45, "4":1.00, "5":0.85};
const GEAR_NAME = {R:"Reverse",N:"Neutral","1":"1st","2":"2nd","3":"3rd","4":"4th","5":"5th"};
const TC = {"2H":1, "4H":1, N:0, "4L":2.72};
const AXLE = 4.11, TIRE_D = 27.1;

/* ---------- Engine parts ---------- */
const ENGINE_PARTS = [
 {id:"block",sys:"core",name:"Engine block",xray:true,ex:[0,0,0],
  what:"The heavy cast-iron core of the engine. It holds the four cylinders the pistons slide in, the crankshaft along the bottom, and the camshaft along the passenger side. Coolant and oil travel through passages cast inside it.",
  specs:[["Material","Cast iron"],["Cylinders","4 in a row, No. 1 at the front"],["Bore","3.88 in (98.4 mm)"],["Main bearings","5"]],
  watch:"Coolant seeping from the freeze plugs on the sides of the block, and oil dripping from the rear main seal where the crankshaft exits the back.",
  links:["head","headGasket","crankshaft","pistons","camshaft","oilPan","timingCover","frame"]},
 {id:"headGasket",sys:"core",name:"Head gasket",ex:[0,7,0],
  what:"A thin layered seal clamped between the block and the cylinder head. It holds combustion pressure inside each cylinder and keeps coolant and oil in their own passages.",
  specs:[["Fire rings","One around each cylinder"],["Sits between","Block deck and head"]],
  watch:"A failing head gasket shows up as white, sweet-smelling exhaust, milky oil, bubbles in the coolant, or overheating that keeps coming back.",
  links:["block","head"]},
 {id:"head",sys:"core",name:"Cylinder head",xray:true,ex:[0,12,0],
  what:"The cast-iron cap on top of the cylinders. Each cylinder's combustion chamber is formed here, along with the intake and exhaust ports, the valve seats, and the spark plug holes. On this engine the intake and exhaust ports are both on the driver side.",
  specs:[["Material","Cast iron"],["Valves","2 per cylinder, 8 total"],["Ports","Intake and exhaust, driver side"],["Spark plugs","Passenger side"]],
  watch:"Severe overheating can warp or crack the head. If coolant keeps disappearing with no visible leak, have the system pressure-tested.",
  links:["block","headGasket","valvetrain","valveCover","intakeManifold","exhaustManifold","sparkPlugs","thermostat"]},
 {id:"valveCover",sys:"core",name:"Valve cover",xray:true,ex:[0,26,0],
  what:"A cover over the top of the head that keeps the oil splashing around the rocker arms inside the engine. It carries the oil fill cap and a hose for the crankcase ventilation (PCV) system.",
  specs:[["Oil fill","Cap on top"],["Ventilation","PCV and breather hoses"]],
  watch:"The gasket is a very common leak. Oil runs down onto the hot exhaust manifold and you smell burning oil after a drive.",
  links:["head","valvetrain"]},
 {id:"timingCover",sys:"core",name:"Timing cover",xray:true,ex:[7,0,0],
  what:"Covers the timing chain at the front of the engine and holds the front crankshaft seal. The crank pulley bolts on just outside it.",
  specs:[["Seal","Front crankshaft seal"],["Location","Front of the block"]],
  watch:"Oil flung around the front of the crank pulley usually means a worn front seal.",
  links:["block","timingChain","belt","crankshaft"]},
 {id:"belt",sys:"core",name:"Serpentine belt & crank pulley",ex:[12,0,0],
  what:"One long ribbed belt, turned by the crankshaft pulley, drives the A/C compressor, alternator, water pump, and power steering pump. A spring-loaded tensioner keeps it tight.",
  specs:[["Driven by","Crankshaft pulley"],["Drives","A/C compressor, alternator, water pump, power steering"],["Tension","Automatic tensioner"]],
  watch:"Squealing at startup or when the A/C kicks on, cracks across the ribs, or a deep water crossing that throws the belt off.",
  links:["crankshaft","acCompressor","alternator","waterPump","psPump","timingCover"]},

 {id:"crankshaft",sys:"rotating",name:"Crankshaft",ex:[0,-8,0],
  what:"Turns the up-and-down motion of the pistons into rotation. Each connecting rod hooks onto an offset journal called a throw. On a four-cylinder, throws 1 and 4 point the same way and throws 2 and 3 point the opposite way, so two pistons are always rising while the other two fall.",
  specs:[["Stroke","3.19 in (81 mm)"],["Main bearings","5"],["Throw layout","1 & 4 together, 2 & 3 opposite"],["Drives","Timing chain, crank pulley, flywheel"]],
  watch:"A deep knock that gets louder under load points to a worn rod or main bearing, often caused by running low on oil.",
  links:["pistons","flywheel","timingChain","belt","block","crankSensor"]},
 {id:"pistons",sys:"rotating",name:"Pistons & connecting rods",ex:[0,4,0],
  what:"Burning fuel pushes each piston down, and its connecting rod passes that force to the crankshaft. Rings around each piston seal against the cylinder wall so pressure stays above it and oil stays below.",
  specs:[["Displacement","150 cu in (2.46 L)"],["Bore × stroke","3.88 × 3.19 in"],["Compression ratio","9.1 : 1"],["Firing order","1‑3‑4‑2"],["Output","120 hp at 5,400 rpm"],["Torque","140 lb‑ft at 3,500 rpm"]],
  watch:"Worn rings let oil into the combustion chamber. That shows up as blue smoke and oil use between changes.",
  links:["crankshaft","block","head","sparkPlugs"]},
 {id:"flywheel",sys:"rotating",name:"Flywheel",ex:[-7,0,0],
  what:"A heavy disc bolted to the back of the crankshaft. Its weight smooths out the gaps between power strokes, its toothed outer ring is what the starter turns, and its edge has notches the crank sensor reads. The clutch bolts to its back face.",
  specs:[["Ring gear","Turned by the starter"],["Timing notches","Read by the crank sensor"],["Clutch","Bolts to its rear face"]],
  watch:"A worn clutch can score the flywheel face. It is usually resurfaced or replaced along with a new clutch.",
  links:["crankshaft","starter","crankSensor","clutch"]},

 {id:"camshaft",sys:"valvetrain",name:"Camshaft",ex:[0,0,-7],
  what:"A long shaft in the block with eight egg-shaped lobes, one for each valve. As it turns, each lobe lifts its valve open and then lets it close. It turns at half the crankshaft's speed, because each valve opens once every two crank revolutions. A gear on the cam also drives the distributor and, through it, the oil pump.",
  specs:[["Location","In the block, passenger side"],["Speed","Half of crank speed"],["Lobes","8 (4 intake, 4 exhaust)"],["Driven by","Timing chain"]],
  watch:"Worn lobes cause a steady tick and a misfire that new plugs don't fix.",

const pickables = [];
function maker(part){
  const base = new THREE.Color(SYS[part.sys].color);
  const H = {
    m(dl, o){o=o||{}; const c=base.clone(); if(o.color) c.set(o.color); else if(dl) c.offsetHSL(0,0,dl);
      const m=new THREE.MeshStandardMaterial({color:c,metalness:o.metal!=null?o.metal:0.3,roughness:o.rough!=null?o.rough:0.55});
      if(o.double) m.side=THREE.DoubleSide;
      part.mats.push(m); return m;},
    add(geo,m,x,y,z,parent,edges){const mesh=new THREE.Mesh(geo,m); mesh.position.set(x,y,z); mesh.userData.pid=part.id;
      (parent||part.group).add(mesh); pickables.push(mesh);
      if(edges!==false) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,30),part.lineMat));
      return mesh;},
    box(m,w,h,d,x,y,z,parent){return H.add(new THREE.BoxGeometry(w,h,d),m,x,y,z,parent);},
    ab(m,x0,x1,y0,y1,z0,z1,parent){return H.box(m,Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0),(x0+x1)/2,(y0+y1)/2,(z0+z1)/2,parent);},
    cyl(m,r,len,axis,x,y,z,o){o=o||{}; const g=new THREE.CylinderGeometry(o.r2!=null?o.r2:r,r,len,o.seg||28,1,!!o.open);
      if(axis==="x") g.rotateZ(Math.PI/2); else if(axis==="z") g.rotateX(Math.PI/2);
      return H.add(g,m,x,y,z,o.parent,o.edges);},
    rod(m,a,b,r,o){o=o||{}; const A=new V(a[0],a[1],a[2]), B=new V(b[0],b[1],b[2]), d=B.clone().sub(A), L=d.length();
      const mesh=H.add(new THREE.CylinderGeometry(r,r,L,o.seg||14),m,(A.x+B.x)/2,(A.y+B.y)/2,(A.z+B.z)/2,o.parent,o.edges);
      mesh.quaternion.setFromUnitVectors(new V(0,1,0),d.normalize()); return mesh;},
    tube(m,pts,r,o){o=o||{}; const c=new THREE.CatmullRomCurve3(pts.map(p=>new V(p[0],p[1],p[2])),!!o.closed,"centripetal");
      return H.add(new THREE.TubeGeometry(c,o.seg||64,r,10,!!o.closed),m,0,0,0,o.parent,false);},
    torus(m,R,t,axis,x,y,z,o){o=o||{}; const g=new THREE.TorusGeometry(R,t,o.rs||10,o.ts||56);
      if(axis==="x") g.rotateY(Math.PI/2); else if(axis==="y") g.rotateX(Math.PI/2);
      return H.add(g,m,x,y,z,o.parent,false);},
    sphere(m,r,x,y,z,o){o=o||{}; return H.add(new THREE.SphereGeometry(r,o.seg||16,12),m,x,y,z,o.parent,false);},
    helix(m,x,y0,z,h,R,turns,wire){const pts=[],n=turns*16; for(let i=0;i<=n;i++){const t=i/n*turns*Math.PI*2; pts.push([x+R*Math.cos(t),y0+h*i/n,z+R*Math.sin(t)]);}
      return H.tube(m,pts,wire,{seg:n*3});},
    pivot(x,y,z,parent){const g=new THREE.Group(); g.position.set(x,y,z); (parent||part.group).add(g); return g;},
    sub(g,v){part.subs.push({g,base:g.position.clone(),v:new V(v[0],v[1],v[2])}); return g;}
  };
  return H;
}
function hull2(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  up.pop();lo.pop();return lo.concat(up);}
function circlePts(cy,cz,r,n){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push([cy+r*Math.cos(t),cz+r*Math.sin(t)]);}return a;}

const SIDES = [1,-1];

function wheelAt(H,mats,x,y,z,side,parent){
  const pv=H.pivot(x,y,z,parent);
  H.torus(mats.tire,9.8,3.7,"z",0,0,0,{parent:pv,rs:14,ts:48});
  H.cyl(mats.rim,7.4,7,"z",0,0,0,{parent:pv,open:true,seg:32});
  H.cyl(mats.rim,7.3,.4,"z",0,0,side*2.6,{parent:pv,seg:32});
  for(let k=0;k<5;k++){const t=k/5*Math.PI*2; H.cyl(mats.lug,.45,.6,"z",2.4*Math.cos(t),2.4*Math.sin(t),side*3.0,{parent:pv,seg:6,edges:false});}
  for(let k=0;k<6;k++){const t=k/6*Math.PI*2+.3; H.cyl(mats.lug,.9,.3,"z",5*Math.cos(t),5*Math.sin(t),side*2.85,{parent:pv,seg:10,edges:false});}
  H.cyl(mats.lug,1.3,.5,"z",0,0,side*3.0,{parent:pv,seg:16});
  return pv;
}
function wheelMats(H){return {tire:H.m(0,{color:"#26292c",rough:.95,metal:0}),rim:H.m(0,{color:"#c4cad0",metal:.75,rough:.3,double:true}),lug:H.m(0,{color:"#7d858d",metal:.8,rough:.3})};}
function shaftAt(H,m,m2,a,b,r){
  const A=new V(a[0],a[1],a[2]), B=new V(b[0],b[1],b[2]), d=B.clone().sub(A), L=d.length();
  const g=H.pivot(A.x,A.y,A.z); g.quaternion.setFromUnitVectors(new V(0,0,1),d.normalize());
  const sp=H.pivot(0,0,0,g);
  H.cyl(m,r,L-2,"z",0,0,L/2,{parent:sp,seg:20});
  H.box(m2,r*3.4,.6,1.6,0,0,.8,sp); H.box(m2,.6,r*3.4,1.6,0,0,L-.8,sp);
  H.box(m2,.5,r*2.6,.5,0,0,L*.35,sp);
  return sp;
}

const engineRoot = new THREE.Group(); engineRoot.position.copy(ENG); scene.add(engineRoot);
const chassisRoot = new THREE.Group(); scene.add(chassisRoot);
PARTS.forEach(p=>{
  p.group=new THREE.Group(); p.mats=[]; p.sparkMats=[]; p.anim={}; p.subs=[]; p.offset=new V(); p.returning=false; p.hidden=false;
  p.lineMat=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.28});
  BUILD[p.id](maker(p),p);
  (p.area==="engine"?engineRoot:chassisRoot).add(p.group);
});
scene.updateMatrixWorld(true);
PARTS.forEach(p=>{p.anchor=new THREE.Box3().setFromObject(p.group).getCenter(new V());});

/* ---------- State ---------- */
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const state = {view:"jeep",selected:null,hover:null,focus:null,xray:true,explode:0,running:!reduceMotion,fast:false,
  gear:"4",tc:"2H",challenge:null};
let explodeShown=0, theta=0, wheelAng=0;
const visible = ()=>PARTS.filter(p=>!p.hidden);

function applyLook(){
  PARTS.forEach(p=>{
    let op=1;
    if(state.xray && p.xray) op=p.xop||.2;
    if(state.focus && p.sys!==state.focus) op=Math.min(op,.06);
    const sel=state.selected===p.id, hov=state.hover===p.id && !sel;
    if(sel && op<.5) op=Math.max(op,.45);
    p.mats.forEach(m=>{
      const tr=op<.999;
      if(m.transparent!==tr){m.transparent=tr; m.needsUpdate=true;}
      m.opacity=op; m.depthWrite=!tr;
      m.emissive.copy(sel||hov?ACCENT:new THREE.Color(0));
      m.emissiveIntensity=sel?.5:hov?.22:0;
    });
    p.sparkMats.forEach(m=>{m.transparent=op<1;m.opacity=op;});
    p.lineMat.opacity=(p.id==="body"?.5:.28)*op;
  });
}

/* ---------- Picking & dragging ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), plane=new THREE.Plane();
function setNdc(e){const r=renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); return r;}
function pick(e){setNdc(e); ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables,false).filter(h=>h.object.visible && !BY[h.object.userData.pid].hidden);
  if(!hits.length) return null;
  const usable=h=>{const p=BY[h.object.userData.pid]; return !(state.focus && p.sys!==state.focus);};
  const solid=hits.find(h=>usable(h) && !(state.xray && BY[h.object.userData.pid].xray));
  return solid || hits.find(usable) || null;}

let drag=null, downEmpty=null;
vp.addEventListener("pointerdown",e=>{
  if(e.target!==renderer.domElement) return;
  if(e.pointerType==="mouse" && e.button!==0) return;
  const hit=pick(e);
  if(!hit){downEmpty={x:e.clientX,y:e.clientY}; return;}
  const p=BY[hit.object.userData.pid];
  controls.enabled=false;
  plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new V()),hit.point);
  drag={p,start:hit.point.clone(),startOff:p.offset.clone(),sx:e.clientX,sy:e.clientY,moved:false};
  p.returning=false;
  try{renderer.domElement.setPointerCapture(e.pointerId);}catch(_){}
  hideTip();
},{capture:true});
window.addEventListener("pointermove",e=>{
  if(drag){
    if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true; select(drag.p.id,true);}
    if(drag.moved){setNdc(e); ray.setFromCamera(ndc,camera); const pt=new V();
      if(ray.ray.intersectPlane(plane,pt)) drag.p.offset.copy(drag.startOff).add(pt.sub(drag.start));}
    return;
  }
  if(e.pointerType!=="mouse" || e.buttons) return;
  const r=renderer.domElement.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){setHover(null);return;}
  const hit=pick(e); setHover(hit?hit.object.userData.pid:null,e);
});
window.addEventListener("pointerup",e=>{
  if(drag){const d=drag; drag=null; controls.enabled=true;
    if(!d.moved) select(d.p.id); else if(state.challenge) trySnap(d.p);
    return;}
  if(downEmpty && Math.hypot(e.clientX-downEmpty.x,e.clientY-downEmpty.y)<4 && e.target===renderer.domElement) select(null);
  downEmpty=null;
});
renderer.domElement.addEventListener("dblclick",e=>{const hit=pick(e); if(hit) sendHome(BY[hit.object.userData.pid]);});

const tip=document.getElementById("tip");
function setHover(id,e){
  if(state.hover!==id){state.hover=id; applyLook(); renderer.domElement.style.cursor=id?"grab":"";}
  if(id && e){const r=vp.getBoundingClientRect(); const p=BY[id];
    tip.innerHTML=p.name+"<i>"+SYS[p.sys].name+"</i>"; tip.hidden=false;
    let x=e.clientX-r.left, y=e.clientY-r.top; if(x>r.width-220) x-=220;
    tip.style.left=x+"px"; tip.style.top=y+"px";}
  else hideTip();
}
function hideTip(){tip.hidden=true;}
function sendHome(p){p.returning=true; if(state.challenge) markPlaced(p);}

/* ---------- Challenge ---------- */
const cbar=document.getElementById("cbar"), toastEl=document.getElementById("toast");
let toastT=0;
function toast(msg,ms){toastEl.textContent=msg; toastEl.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>toastEl.hidden=true,ms||2600);}
function screenOf(v){const r=renderer.domElement.getBoundingClientRect(); const q=v.clone().project(camera); return [(q.x+1)/2*r.width,(1-q.y)/2*r.height];}
function startChallenge(){
  const jeep=state.view==="jeep";
  const list=visible().filter(p=>jeep?(p.area==="chassis"&&p.id!=="frame"):(p.id!=="block")).map(p=>p.id);
  state.challenge={list:new Set(list),placed:new Set(),t0:performance.now(),done:false};
  state.explode=0; explodeEl.value=0; state.focus=null; state.selected=null;
  const c = jeep?new V(0,20,0):ENG.clone().add(new V(2,0,0));
  PARTS.forEach(p=>{p.returning=false; if(!state.challenge.list.has(p.id)){p.offset.set(0,0,0);return;}
    const a=Math.random()*Math.PI*2, rad=jeep?(110+Math.random()*45):(24+Math.random()*10);
    const tgt=new V(c.x+Math.cos(a)*rad, jeep?(5+Math.random()*55):(c.y-3+Math.random()*20), c.z+Math.sin(a)*rad);
    p.offset.copy(tgt.sub(p.anchor));});
  flyTo(CAMS[state.view].ch,CAMS[state.view].tgt);
  syncUI(); renderPanel(); applyLook();
  toast(jeep?"Drag each part back onto the frame. It snaps in when it lines up.":"Drag each part back onto the block. It snaps in when it lines up.",4200);
}
function trySnap(p){
  const ch=state.challenge; if(!ch||!ch.list.has(p.id)) return;
  if(p.offset.length()<.8){markPlaced(p);return;}
  const a=screenOf(p.anchor), b=screenOf(p.anchor.clone().add(p.offset));
  if(Math.hypot(a[0]-b[0],a[1]-b[1])<46){p.returning=true; markPlaced(p);}
  else if(ch.placed.has(p.id)){ch.placed.delete(p.id); renderCbar();}
}
function markPlaced(p){const ch=state.challenge; if(!ch||!ch.list.has(p.id)||ch.placed.has(p.id)) return;
  ch.placed.add(p.id); toast(p.name+" is in place.",1400); renderCbar();
  if(ch.placed.size===ch.list.size){ch.done=true; const s=Math.round((performance.now()-ch.t0)/1000);
    toast("Rebuilt in "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+".",5000); renderCbar();}}
function endChallenge(noFly){state.challenge=null; PARTS.forEach(p=>p.returning=true); if(!noFly) flyTo(CAMS[state.view].pos,CAMS[state.view].tgt); syncUI(); renderPanel();}
function renderCbar(){
  const ch=state.challenge; cbar.hidden=!ch; if(!ch) return;
  cbar.innerHTML='<span class="count">'+ch.placed.size+' / '+ch.list.size+'</span><span class="lbl">'+(ch.done?"rebuilt":"parts in place")+'</span>'+
   (ch.done?"":'<button class="btn" data-act="hint">Hint</button>')+'<button class="btn" data-act="quit">'+(ch.done?"Done":"Quit")+'</button>';
}
cbar.addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(!b) return; if(b.dataset.act==="quit") endChallenge(); else hint();});
let hintLine=null, hintT=0;
function hint(){
  const ch=state.challenge; if(!ch) return;
  let p=state.selected && ch.list.has(state.selected) && !ch.placed.has(state.selected)?BY[state.selected]:null;
  if(!p){const left=[...ch.list].filter(id=>!ch.placed.has(id)); if(!left.length) return; p=BY[left[Math.floor(Math.random()*left.length)]]; select(p.id);}
  if(hintLine) scene.remove(hintLine);
  const g=new THREE.BufferGeometry().setFromPoints([p.anchor.clone().add(p.offset),p.anchor.clone()]);
  hintLine=new THREE.Line(g,new THREE.LineDashedMaterial({color:ACCENT,dashSize:state.view==="jeep"?3:.8,gapSize:state.view==="jeep"?2:.5,depthTest:false,transparent:true}));
  hintLine.computeLineDistances(); hintLine.renderOrder=10; hintLine.userData.p=p; scene.add(hintLine);
  clearTimeout(hintT); hintT=setTimeout(()=>{if(hintLine){scene.remove(hintLine);hintLine=null;}},3000);
  toast("Follow the dashed line to where the "+p.name.toLowerCase()+" goes.",2600);
}

/* ---------- Camera fly ---------- */
let fly=null;
function flyTo(pos,tgt){fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos.clone(),t1:tgt.clone(),s:performance.now()};}

/* ---------- Panel ---------- */
const panel=document.getElementById("panel");
function sw(sys){return 'style="--c:'+SYS[sys].color+'"';}
function sysRow(k){const n=visible().filter(p=>p.sys===k).length;
  return '<button class="sysrow" '+sw(k)+' data-go="sys:'+k+'"><span class="sw"></span><span><b>'+SYS[k].name+'</b><small>'+SYS[k].desc+'</small></span><span class="ct">'+n+'</span></button>';}
function specs(rows){return '<dl class="specs">'+rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join("")+'</dl>';}
function renderPanel(){
  const ch=state.challenge, jeep=state.view==="jeep";
  const cc = ch ? '<div class="challengecard"><b>Rebuild challenge.</b> Drag each part back to where it belongs. Click a part to read what it does and what it works with. Stuck? <b>Hint</b> draws a dashed line to its spot.</div>' : "";
  if(state.selected){
    const p=BY[state.selected], s=SYS[p.sys];
    const links=p.links.filter(id=>BY[id]&&!BY[id].hidden);
    panel.innerHTML=cc+
     '<nav class="crumbs" aria-label="Breadcrumb"><button class="link" data-go="overview">'+(jeep?"Jeep":"Engine")+'</button><span>/</span><button class="link" data-go="sys:'+p.sys+'">'+s.name+'</button></nav>'+
     '<span class="eyebrow" '+sw(p.sys)+'><span class="sw"></span>'+s.name+'</span>'+
     '<h2>'+p.name+'</h2><p class="lede">'+p.what+'</p>'+
     '<h3>On this Jeep</h3>'+specs(p.specs)+
     '<h3>Watch for</h3><div class="watch"><p>'+p.watch+'</p></div>'+
     (links.length?'<h3>Works with</h3><div class="rel">'+links.map(id=>{const q=BY[id];return '<button class="chip" '+sw(q.sys)+' data-go="part:'+id+'"><span class="sw"></span>'+q.name+'</button>';}).join("")+'</div>':'')+
     '<div class="actions"><button class="btn" data-act="home">Put it back</button><button class="btn" data-act="solo" aria-pressed="'+(state.focus===p.sys)+'">Highlight '+s.name.toLowerCase()+'</button>'+(ch&&!ch.done&&ch.list.has(p.id)?'<button class="btn" data-act="hint">Show where it goes</button>':'')+'</div>';
    return;
  }
  if(state.focus){
    const s=SYS[state.focus], list=visible().filter(p=>p.sys===state.focus);
    panel.innerHTML=cc+
     '<nav class="crumbs"><button class="link" data-go="overview">'+(jeep?"Jeep":"Engine")+'</button><span>/</span><span>'+s.name+'</span></nav>'+
     '<span class="eyebrow" '+sw(state.focus)+'><span class="sw"></span>System</span><h2>'+s.name+'</h2><p class="lede">'+s.desc+'</p>'+
     '<h3>Parts in this system</h3><div class="syslist">'+list.map(p=>
       '<button class="sysrow" '+sw(p.sys)+' data-go="part:'+p.id+'"><span class="sw"></span><span><b>'+p.name+'</b><small>'+p.what.split(". ")[0]+'.</small></span><span class="ct">›</span></button>').join("")+'</div>'+
     '<div class="actions"><button class="btn" data-go="overview">Show all systems</button></div>';
    return;
  }
  const how='<h3>How to use it</h3><ul class="howto">'+
   '<li><b>Drag</b><span>Pull any part off. Double-click it to send it back.</span></li>'+
   '<li><b>Click</b><span>Read what the part does, its specs, and what tends to go wrong.</span></li>'+
   '<li><b>View</b><span>Switch between the whole Jeep and the engine on its own.</span></li>'+
   '<li><b>Explode</b><span>Spread every part out along the direction it comes off.</span></li>'+
   '<li><b>See inside</b><span>Turn the body, engine castings, and gearbox cases to glass.</span></li>'+
   (jeep?'<li><b>Gear</b><span>Pick a gear and transfer case range to see the wheels and driveshafts turn and the speed it gives.</span></li>':'<li><b>Run engine</b><span>Watch the four strokes in the corner strip.</span></li>')+
   '<li><b>Rebuild</b><span>'+(jeep?"Scatter the chassis and put it back on the frame.":"Scatter the engine and put it back together.")+'</span></li></ul>'+
   '<p class="foot">The model is a simplified teaching layout. Shapes and positions are close to the real Jeep but not to scale. Check a factory service manual before working on a real one.</p>';
  if(jeep){
    const chassisSys=SYS_ORDER.filter(k=>!ENGINE_SYS.includes(k)), engSys=ENGINE_SYS;
    panel.innerHTML=cc+
     '<span class="eyebrow">2000 Jeep Wrangler TJ</span><h2>The whole Jeep</h2>'+
     '<p class="lede">A body-on-frame 4×4 with solid axles at both ends, coil springs at every corner, and a part-time transfer case. This one has the 2.5L four-cylinder, the AX5 five-speed manual, and air conditioning.</p>'+
     '<h3>Factory specs</h3>'+specs([["Wheelbase","93.4 in"],["Track","58 in"],["Engine","2.5L I4, 120 hp, 140 lb‑ft"],["Transmission","Aisin AX5 five-speed manual"],["Transfer case","NP231 Command-Trac, 2.72 : 1 low"],["Axles","Dana 30 front, Dana 35 rear"],["Suspension","Quadra-Coil, solid axles"],["Brakes","Front disc, rear drum"],["Stock tires","P205/75R15"],["Air conditioning","R-134a, belt-driven compressor"]])+
     '<h3>Chassis systems</h3><div class="syslist">'+chassisSys.map(sysRow).join("")+'</div>'+
     '<h4>Engine & A/C systems</h4><div class="syslist">'+engSys.map(sysRow).join("")+'</div>'+how;
  } else {
    panel.innerHTML=cc+
     '<span class="eyebrow">2000 Jeep Wrangler TJ</span><h2>2.5L inline-four</h2>'+
     '<p class="lede">The base engine in the 2000 Wrangler: an AMC-designed four-cylinder with a cast-iron block and head, a pushrod valvetrain, and multiport fuel injection.</p>'+
     '<h3>Factory specs</h3>'+specs([["Displacement","150 cu in (2.46 L)"],["Bore × stroke","3.88 × 3.19 in"],["Compression","9.1 : 1"],["Power","120 hp at 5,400 rpm"],["Torque","140 lb‑ft at 3,500 rpm"],["Firing order","1‑3‑4‑2"],["Valvetrain","Pushrod, 2 valves per cylinder"],["Fuel","Sequential multiport injection"],["Ignition","Distributor with one coil"]])+
     '<h3>Systems</h3><div class="syslist">'+SYS_ORDER.filter(k=>visible().some(p=>p.sys===k)).map(sysRow).join("")+'</div>'+how;
  }
}
panel.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"), a=e.target.closest("[data-act]");
  if(g){const v=g.dataset.go;
    if(v==="overview"){state.selected=null; state.focus=null;}
    else if(v.startsWith("sys:")){state.selected=null; state.focus=v.slice(4);}
    else if(v.startsWith("part:")){select(v.slice(5)); return;}
    syncUI(); renderPanel(); applyLook(); panel.scrollTop=0; return;}
  if(a){const p=BY[state.selected];
    if(a.dataset.act==="home"&&p) sendHome(p);
    else if(a.dataset.act==="solo"&&p){state.focus=state.focus===p.sys?null:p.sys; syncUI(); renderPanel(); applyLook();}
    else if(a.dataset.act==="hint") hint();}
});
function select(id,quiet){
  if(state.selected===id && quiet) return;
  state.selected=id;
  if(id && state.focus && BY[id].sys!==state.focus) state.focus=null;
  syncUI(); renderPanel(); applyLook(); if(!quiet) panel.scrollTop=0;
}

/* ---------- Toolbar & chips ---------- */
const $=id=>document.getElementById(id);
const chips=$("chips");
function buildChips(){
  const present=SYS_ORDER.filter(k=>visible().some(p=>p.sys===k));
  const ch=present.filter(k=>!ENGINE_SYS.includes(k)), en=present.filter(k=>ENGINE_SYS.includes(k));
  const c=k=>'<button class="chip" data-sys="'+k+'" '+sw(k)+'><span class="sw"></span>'+SYS[k].name+'</button>';
  chips.innerHTML='<button class="chip" data-sys="" style="--c:var(--fg)">All systems</button>'+
    (ch.length?ch.map(c).join("")+'<span class="chipsep"></span>':'')+en.map(c).join("");
}
chips.addEventListener("click",e=>{const b=e.target.closest("[data-sys]"); if(!b) return;
  const k=b.dataset.sys||null; state.focus=(k&&state.focus===k)?null:k;
  if(state.selected && state.focus && BY[state.selected].sys!==state.focus) state.selected=null;
  syncUI(); renderPanel(); applyLook();});
const explodeEl=$("explode"), explodeWrap=$("explodeWrap");
explodeEl.addEventListener("input",()=>{state.explode=+explodeEl.value;});
$("xray").onclick=()=>{state.xray=!state.xray; syncUI(); applyLook();};
$("run").onclick=()=>{state.running=!state.running; syncUI();};
$("speed").onclick=()=>{state.fast=!state.fast; syncUI();};
$("reassemble").onclick=()=>{PARTS.forEach(p=>p.returning=true); state.explode=0; explodeEl.value=0;};
$("resetView").onclick=()=>{const c=CAMS[state.view]; flyTo(state.challenge?c.ch:c.pos,c.tgt);};
$("challenge").onclick=()=>{state.challenge?endChallenge():startChallenge();};
$("viewSeg").addEventListener("click",e=>{const b=e.target.closest("[data-v]"); if(b && b.dataset.v!==state.view) setView(b.dataset.v);});
const gearSeg=$("gearSeg"), tcSeg=$("tcSeg");
gearSeg.innerHTML=["R","N","1","2","3","4","5"].map(g=>'<button data-g="'+g+'" aria-label="'+GEAR_NAME[g]+'">'+g+'</button>').join("");
tcSeg.innerHTML=["2H","4H","N","4L"].map(t=>'<button data-t="'+t+'" aria-label="'+(t==="N"?"Neutral":t)+'">'+t+'</button>').join("");
gearSeg.addEventListener("click",e=>{const b=e.target.closest("[data-g]"); if(b){state.gear=b.dataset.g; syncUI();}});
tcSeg.addEventListener("click",e=>{const b=e.target.closest("[data-t]"); if(b){state.tc=b.dataset.t; syncUI();}});

function setView(v){
  if(state.challenge) endChallenge(true);
  state.view=v;
  PARTS.forEach(p=>{p.hidden = v==="engine" && p.area!=="engine"; p.group.visible=!p.hidden;});
  if(grid) grid.visible = v==="jeep";
  if(state.selected && BY[state.selected].hidden) state.selected=null;
  if(state.focus && !visible().some(p=>p.sys===state.focus)) state.focus=null;
  buildChips(); flyTo(CAMS[v].pos,CAMS[v].tgt);
  syncUI(); renderPanel(); applyLook();
}

const strip=$("strip"), drivebox=$("drivebox");
function driveInfo(){
  const g=GEARS[state.gear], t=TC[state.tc];
  const head=GEAR_NAME[state.gear]+(state.gear==="N"?"":" gear")+" · "+(state.tc==="N"?"transfer case N":state.tc);
  if(!g) return head && '<b>'+head+'</b>The engine turns, but the transmission sends nothing to the driveshafts.';
  if(!t) return '<b>'+head+'</b>The transmission turns, but the transfer case sends power to neither axle.';
  const total=Math.abs(g)*t*AXLE, wr=2000/total, mph=wr*TIRE_D*Math.PI*60/63360;
  const note={"2H":"Only the rear axle is driven. The front driveshaft still spins with the front wheels, because the TJ has no front axle disconnect.",
    "4H":"Front and rear driveshafts are locked together for traction on loose or slippery ground.",
    "4L":"Low range multiplies torque 2.72 times for crawling over rocks or steep grades."}[state.tc];
  return '<b>'+head+'</b>At 2,000 engine rpm: <span class="num">'+Math.abs(g).toFixed(2)+' × '+t.toFixed(2)+' × '+AXLE+' = '+total.toFixed(1)+' : 1</span> → wheels <span class="num">'+Math.round(wr)+'</span> rpm ≈ <span class="num">'+mph.toFixed(mph<10?1:0)+'</span> mph'+(g<0?' backward':'')+'.<div class="note">'+note+'</div>';
}
function syncUI(){
  const jeep=state.view==="jeep", ch=!!state.challenge;
  [...$("viewSeg").children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===state.view)));
  $("xray").setAttribute("aria-pressed",state.xray);
  $("run").setAttribute("aria-pressed",state.running); $("run").textContent=state.running?"Stop engine":"Run engine";
  $("speed").setAttribute("aria-pressed",state.fast); $("speed").textContent="Speed: "+(state.fast?"fast":"slow");
  $("speed").disabled=!state.running;
  explodeEl.disabled=ch; explodeWrap.classList.toggle("off",ch);
  $("reassemble").disabled=ch;
  $("challenge").textContent=ch?"End challenge":"Rebuild challenge";
  $("driveCtl").hidden=!jeep;
  [...gearSeg.children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.g===state.gear)));
  [...tcSeg.children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===state.tc)));
  strip.hidden=!state.running;
  drivebox.hidden=!jeep; if(jeep) drivebox.innerHTML=driveInfo();
  [...chips.querySelectorAll("[data-sys]")].forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.sys||null)===state.focus)));
  renderCbar();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){state.selected=null; state.focus=null; syncUI(); renderPanel(); applyLook();}});

/* ---------- Motion ---------- */
const STROKES=[["Power","ignition"],["Exhaust","exhaust"],["Intake","airfuel"],["Compression","valvetrain"]];
strip.innerHTML=CYL_X.map((_,i)=>'<div class="cell" id="cell'+i+'"><div class="n">CYL '+(i+1)+'</div><div class="s">—</div></div>').join("")+'<div class="meta" id="smeta"></div>';
const cells=CYL_X.map((_,i)=>$("cell"+i)), smeta=$("smeta");
const lastStroke=[-1,-1,-1,-1];
function mod(a,n){return ((a%n)+n)%n;}
function pose(th){
  const deg=th*180/Math.PI;
  BY.crankshaft.anim.rot.rotation.x=th; BY.flywheel.anim.rot.rotation.x=th;
  BY.camshaft.anim.rot.rotation.x=th/2; BY.fan.anim.rot.rotation.x=th*1.1;
  BY.transmission.anim.main.rotation.x=th;
  BY.pistons.anim.list.forEach(o=>{const a=th+THROW[o.i], ys=CR*Math.cos(a), zs=CR*Math.sin(a);
    const yp=ys+Math.sqrt(ROD*ROD-zs*zs);
    o.pg.position.y=yp; o.rg.position.set(CYL_X[o.i],ys,zs); o.rg.rotation.x=Math.atan2(-zs,yp-ys);});
  BY.valvetrain.anim.valves.forEach(v=>{const c=mod(deg-PHASE[v.i],720)-v.open;
    const lift=(c>=0&&c<=180)?LIFT*Math.sin(c/180*Math.PI):0;
    v.vg.position.y=-lift; v.pg.position.y=lift; v.rk.rotation.x=Math.asin(Math.min(1,lift/1.3));});
  BY.sparkPlugs.anim.sparks.forEach((s,i)=>{const c=mod(deg-PHASE[i]+12,720); s.visible=state.running && c<32;});
  BY.frontWheels.anim.spin.forEach(w=>w.rotation.z=-wheelAng);
  BY.rearWheels.anim.spin.forEach(w=>w.rotation.z=-wheelAng);
  BY.frontDriveshaft.anim.sp.rotation.z=wheelAng*AXLE;
  BY.rearDriveshaft.anim.sp.rotation.z=wheelAng*AXLE;
  if(state.running){
    CYL_X.forEach((_,i)=>{const k=Math.floor(mod(deg-PHASE[i],720)/180);
      if(k!==lastStroke[i]){lastStroke[i]=k; cells[i].style.setProperty("--c",SYS[STROKES[k][1]].color); cells[i].querySelector(".s").textContent=STROKES[k][0];}});
    smeta.textContent="Crank "+String(Math.floor(mod(deg,360))).padStart(3," ")+"° · cam "+String(Math.floor(mod(deg/2,360))).padStart(3," ")+"° · firing order 1‑3‑4‑2";
  }
}

/* ---------- Resize, theme, loop ---------- */
function resize(){const w=vp.clientWidth, h=vp.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(vp); resize();
if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme","class"]});

let last=performance.now();
const ZERO=new V();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  if(state.running){const d=dt*(state.fast?16:2.0); theta+=d;
    const g=GEARS[state.gear], tc=TC[state.tc];
    if(g && tc) wheelAng+=d/(g*tc*AXLE);}
  explodeShown+=(state.explode-explodeShown)*Math.min(1,dt*10);
  const e=explodeShown;
  PARTS.forEach(p=>{
    if(p.returning){p.offset.lerp(ZERO,Math.min(1,dt*8)); if(p.offset.lengthSq()<1e-4){p.offset.set(0,0,0);p.returning=false;}}
    p.group.position.set(p.ex[0]*e+p.offset.x,p.ex[1]*e+p.offset.y,p.ex[2]*e+p.offset.z);
    p.subs.forEach(s=>s.g.position.copy(s.base).addScaledVector(s.v,e));});
  if(hintLine){const p=hintLine.userData.p; const pos=hintLine.geometry.attributes.position;
    const a=p.anchor.clone().add(p.offset); pos.setXYZ(0,a.x,a.y,a.z); pos.needsUpdate=true; hintLine.computeLineDistances();}
  if(fly){const k=Math.min(1,(t-fly.s)/900), s=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,s); controls.target.lerpVectors(fly.t0,fly.t1,s); if(k>=1) fly=null;}
  pose(theta);
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
applyTheme(); buildChips(); syncUI(); renderPanel();
requestAnimationFrame(frame);
})();
</script>
